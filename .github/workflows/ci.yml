# Twine CI — mirrors `cargo xtask ci`.
# The toolchain comes from rust-toolchain.toml (stable + embedded targets), so no toolchain
# action is needed for the stable jobs.
#
# The `firmware` jobs build the example firmware in `firmware/` (one standalone project per chip
# family) for each of its feature sets and add flash/RAM sizes to the job summary.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo xtask ci --only fmt

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --only clippy --only clippy-all-features --only clippy-defmt

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install winit build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --only test --only test-features

  sim-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install winit and SDL2 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libsdl2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask sim-smoke
      # `eg_simulator` (embedded-graphics-simulator, SDL2): build + clippy only.
      - run: cargo xtask ci --only eg-sim

  # The stack of the engine's recursive tree walks at the reference depth (R5.S05; release build).
  stack-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask stack-budget

  nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask nostd

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci --only doc

  todo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask todo-check

  layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask layers

  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fonts --check

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gen-assets --check
      - run: cargo xtask images --check

  style-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask style-props --check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo xtask coverage

  # MC/DC of the core crates (R5.S08): rustc's MC/DC instrumentation needs nightly.
  coverage-mcdc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo xtask coverage --mcdc

  # Verification evidence (R5.S08): no golden image awaits approval, and the requirements →
  # tests matrix is current (skipped with a note when `docs/` is not in the checkout); every shift
  # by a non-literal amount carries a proof (R5.S09), every divisor is proven non-zero (R5.S10)
  # and the coding-guidelines register's measured block is current (the inventory and register
  # checks need `docs/`).
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask snapshots --check
      - run: cargo xtask traceability --check
      - run: cargo xtask shifts --check
      - run: cargo xtask divisions --check
      - run: cargo xtask guidelines --check

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask miri

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind-runner@0.16.1
      - run: cargo xtask bench --iai

  firmware:
    strategy:
      fail-fast: false
      matrix:
        example: [rp2040, rp2350, stm32f411, stm32f429i-disco, esp32c3, esp32c6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            firmware/${{ matrix.example }}
      - run: cargo xtask firmware ${{ matrix.example }} --strict

  firmware-xtensa:
    strategy:
      fail-fast: false
      matrix:
        example: [esp32s3, esp32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: false
          override: false
          buildtargets: ${{ matrix.example }}
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            firmware/${{ matrix.example }}
      - run: cargo xtask firmware ${{ matrix.example }} --strict
