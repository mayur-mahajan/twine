# Built-in fonts of `twine-assets`, regenerated by `cargo xtask fonts` (`--check` verifies that
# the generated files in crates/twine-assets/src/fonts/ are up to date).
#
# Fields: name (static), feature (twine-assets cargo feature), file (output in
# crates/twine-assets/src/fonts/), ttf, size (px), bpp, ranges, symbols ("fa" | "none"),
# compress, kerning, subpx ("none" | "hor" | "ver", optional).
#
# Montserrat: bitmaps up to 16 px are stored plain (faster to draw), larger ones compressed
# (smaller flash) — the same trade-off as LVGL's built-in fonts.

[[font]]
name = "MONTSERRAT_8"
feature = "montserrat-8"
file = "montserrat_8.rs"
ttf = "assets/fonts/Montserrat-Medium.ttf"
size = 8
bpp = 4
ranges = ["0x20-0x7F", "0xB0", "0x2022"]
symbols = "fa"
compress = false
kerning = true

