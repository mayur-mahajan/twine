[package]
name = "twine-cli"
description = "The `twine` command: font and image converters and translation compiler (front end of twine-build)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "twine"
path = "src/main.rs"
# The binary shares its name with the `twine` facade crate; only the library is documented.
doc = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# The generators: `twine font`, `twine image` and `twine i18n` are its command-line front ends.
twine-build = { path = "../../crates/twine-build" }
twine-text = { path = "../../crates/twine-text", features = ["std"] }
twine-core = { path = "../../crates/twine-core", features = ["std"] }
# `cargo xtask gen-assets`: the procedurally drawn sample images (PNG, GIF and QOI encoders).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "qoi"] }

[dev-dependencies]
# `twine image --bin` output is decoded as the engine does for `ImageSource::File`.
twine-image = { path = "../../crates/twine-image", features = ["std", "img-lz4"] }
twine-build = { path = "../../crates/twine-build" }
