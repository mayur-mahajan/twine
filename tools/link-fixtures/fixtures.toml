# Linking fixtures (R7.S01; design `docs/plan/r7-theming-design.md` §2.9.7): what each image of
# `src/bin/` must NOT link because its source does not reference it. `cargo xtask nostd` links
# every fixture (release, `thumbv7em-none-eabihf`) and checks its symbol table against these
# rules (`tools/xtask/src/cmd/link_check.rs`).
#
# A rule names an item and the symbols it lives in: `forbid` patterns are substrings of the
# demangled symbol names (no hashes, e.g.
# `<twine_theme::lvgl::Lvgl as twine_engine::theme_hook::ThemeHook>::apply`);
# a symbol matching an `allow` pattern is exempt. The patterns name where the item lives in the
# code of today: a step that moves an item (code to static data, a renamed theme) updates them.
#
# `until = "R7.Sxx"` marks a known failure: the item IS linked today although the source does
# not reference it — the R7 baseline — and the step named is expected to remove it. The check
# fails on a violation without `until` (a regression) and on an `until` rule that passes (the
# step that fixed it removes the mark, so the baseline only shrinks).

[[fixture]]
bin = "no_theme"

