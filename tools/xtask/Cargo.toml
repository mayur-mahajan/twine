[package]
name = "xtask"
description = "Build automation for the Twine workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# `cargo xtask fonts`: reads assets/fonts/fonts.toml and runs the font generator in-process.
toml = "0.9"
serde = { version = "1", features = ["derive"] }
twine-cli = { path = "../twine-cli" }
# `cargo xtask fonts` / `images`: the generators (`twine-cli` parses the text fields).
twine-build = { path = "../../crates/twine-build" }
# `cargo xtask style-props`: the property table is generated from the style metadata.
twine-style = { path = "../../crates/twine-style", features = ["std"] }
# `cargo xtask snapshots`: the golden-image manifest format and the run records (one
# definition, shared with the snapshot assertions). No harness features: core + hal + png only.
twine-testing = { path = "../../crates/twine-testing", default-features = false }
# `cargo xtask shifts` (and the R5.S10 division audit): AST scan of the library sources. The same
# `syn` 2 as `twine-macros`; `span-locations` gives the line of each site.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `cargo xtask theme-size` and the linking fixtures of `cargo xtask nostd`: symbol names of the
# firmware images (v0 and legacy mangling).
rustc-demangle = "0.1"
