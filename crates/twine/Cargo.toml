[package]
name = "twine"
description = "Twine: declarative, low-power GUI for embedded devices (facade crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["color-rgb565", "color-rgb565-swapped", "img-qoi", "perf-monitor", "log"]
## std-only conveniences (thread-local reactive runtime).
std = [
    "twine-core/std",
    "twine-reactive/std",
    "twine-anim/std",
    "twine-render/std",
    "twine-text/std",
    "twine-image/std",
    "twine-style/std",
    "twine-layout/std",
    "twine-engine/std",
    "twine-theme/std",
    "twine-widgets/std",
    "twine-view/std",
]
## The async runtime (`AsyncUi`, `Ui::builder_async`) and the async HAL traits.
async = ["twine-hal/async", "twine-view/async"]
## Log through the `log` crate.
log = ["twine-view/log", "twine-layout/log"]
## Log through `defmt`.
defmt = ["twine-view/defmt", "twine-layout/defmt"]
## On-screen performance overlay.
perf-monitor = ["twine-engine/perf-monitor"]
## Expensive engine invariant checks.
debug-checks = ["twine-engine/debug-checks"]
## Keep test ids in release builds.
test-ids = ["twine-engine/test-ids"]
## Pixel formats the renderer is compiled for.
color-rgb565 = ["twine-engine/color-rgb565"]
color-rgb565-swapped = ["twine-engine/color-rgb565-swapped"]
color-rgb888 = ["twine-engine/color-rgb888"]
color-xrgb8888 = ["twine-engine/color-xrgb8888"]
color-argb8888 = ["twine-engine/color-argb8888"]
color-l8 = ["twine-engine/color-l8"]
## Monochrome `I1` displays (also compiles `L8`: partial `I1` panels are drawn in `L8`).
color-i1 = ["twine-engine/color-i1"]
## Image decoders.
img-qoi = ["twine-image/img-qoi"]
img-png = ["twine-image/img-png"]
img-jpeg = ["twine-image/img-jpeg"]
img-gif = ["twine-image/img-gif"]
img-bmp = ["twine-image/img-bmp"]
img-lz4 = ["twine-image/img-lz4"]
## Bidirectional (mixed LTR/RTL) text in every widget.
bidi = ["twine-widgets/bidi", "twine-widgets-ext/bidi"]
## Arabic/Persian contextual forms in labels.
arabic-shaping = ["twine-widgets/arabic-shaping", "twine-widgets-ext/arabic-shaping"]
## Vector graphics: `vector_canvas`, `twine::vector` (paths, fills, strokes, gradients).
vector = ["dep:twine-vector", "twine-view/vector"]
## SVG images: `image(ImageSource::Svg(include_bytes!(..)))` drawn as vectors.
svg = ["vector", "twine-view/svg"]
## Runtime TrueType fonts (`twine::text::TtfFont`).
ttf = ["twine-text/ttf"]
## File system (`twine::fs`) and file images (`Engine::set_vfs`).
fs = ["dep:twine-fs", "twine-engine/fs"]
## Built-in fonts (`twine::fonts`).
montserrat-8 = ["twine-assets/montserrat-8"]
montserrat-10 = ["twine-assets/montserrat-10"]
montserrat-12 = ["twine-assets/montserrat-12"]
montserrat-14 = ["twine-assets/montserrat-14"]
montserrat-16 = ["twine-assets/montserrat-16"]
montserrat-18 = ["twine-assets/montserrat-18"]
montserrat-20 = ["twine-assets/montserrat-20"]
montserrat-22 = ["twine-assets/montserrat-22"]
montserrat-24 = ["twine-assets/montserrat-24"]
montserrat-26 = ["twine-assets/montserrat-26"]
montserrat-28 = ["twine-assets/montserrat-28"]
montserrat-30 = ["twine-assets/montserrat-30"]
montserrat-32 = ["twine-assets/montserrat-32"]
montserrat-34 = ["twine-assets/montserrat-34"]
montserrat-36 = ["twine-assets/montserrat-36"]
montserrat-38 = ["twine-assets/montserrat-38"]
montserrat-40 = ["twine-assets/montserrat-40"]
montserrat-42 = ["twine-assets/montserrat-42"]
montserrat-44 = ["twine-assets/montserrat-44"]
montserrat-46 = ["twine-assets/montserrat-46"]
montserrat-48 = ["twine-assets/montserrat-48"]
montserrat-14-subpx = ["twine-assets/montserrat-14-subpx"]
unscii-8 = ["twine-assets/unscii-8"]
unscii-16 = ["twine-assets/unscii-16"]
montserrat-16-latin-ext = ["twine-assets/montserrat-16-latin-ext"]
dejavu-16-persian-hebrew = ["twine-assets/dejavu-16-persian-hebrew"]
source-han-sans-sc-14-cjk = ["twine-assets/source-han-sans-sc-14-cjk"]
source-han-sans-sc-16-cjk = ["twine-assets/source-han-sans-sc-16-cjk"]
all-fonts = ["twine-assets/all-fonts"]
## Every optional, platform-neutral part of the facade: all pixel formats, image decoders, vector
## graphics and SVG, runtime TrueType fonts, the file system, bidirectional text and Arabic shaping,
## the async runtime and every built-in font. For hosts, simulators, tests and documentation;
## firmware picks only what it uses. Logging backends (`log`/`defmt`), `std` and the debugging aids
## (`debug-checks`, `test-ids`) are not included: they are platform or build choices.
full = [
    "async",
    "perf-monitor",
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
    "img-qoi",
    "img-png",
    "img-jpeg",
    "img-gif",
    "img-bmp",
    "img-lz4",
    "bidi",
    "arabic-shaping",
    "vector",
    "svg",
    "ttf",
    "fs",
    "all-fonts",
]


[dependencies]
twine-core = { path = "../twine-core" }
twine-hal = { path = "../twine-hal" }
twine-reactive = { path = "../twine-reactive" }
twine-anim = { path = "../twine-anim" }
twine-render = { path = "../twine-render" }
twine-text = { path = "../twine-text" }
twine-image = { path = "../twine-image" }
twine-style = { path = "../twine-style" }
twine-layout = { path = "../twine-layout" }
twine-engine = { path = "../twine-engine" }
twine-theme = { path = "../twine-theme" }
twine-widgets = { path = "../twine-widgets" }
twine-widgets-ext = { path = "../twine-widgets-ext" }
twine-view = { path = "../twine-view" }
twine-assets = { path = "../twine-assets" }
twine-fs = { path = "../twine-fs", optional = true }
twine-vector = { path = "../twine-vector", optional = true }

# Tests and the simulator examples (`examples/`, run with `cargo run -p twine --example <name>`
# or `cargo xtask sim <name>`). Dev-dependencies only: they never reach firmware builds.
[dev-dependencies]
# Every optional part of the facade (the examples show all of them), on the host.
twine = { path = ".", features = ["std", "full"] }
# `StdFs` (a host directory as a drive) for the file-system examples.
twine-fs = { path = "../twine-fs", features = ["fs-std"] }
twine-sim = { path = "../twine-sim" }
twine-testing = { path = "../twine-testing" }
twine-demos = { path = "../twine-demos", features = ["multilang-cjk", "ttf", "vector", "lottie"] }
# Host implementation for `critical-section` (used by `twine_reactive::Channel`).
critical-section = { version = "1", features = ["std"] }
env_logger = "0.11"
