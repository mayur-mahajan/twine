[package]
name = "twine-embassy"
description = "Embassy async run loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## The safety profile (`twine` feature `safety`, see `docs/safety/profile.md`): the
## safety lints of library code and the refusal of excluded features.
safety = ["twine-core/safety", "twine-hal/safety", "twine-reactive/safety", "twine-view/safety"]
## Log through `defmt`.
defmt = ["dep:defmt", "twine-core/defmt", "twine-view/defmt", "twine-hal/defmt", "twine-reactive/defmt"]
## Log through the `log` crate.
log = ["twine-core/log", "twine-view/log", "twine-hal/log", "twine-reactive/log"]

[dependencies]
twine-core = { path = "../twine-core" }
twine-hal = { path = "../twine-hal", features = ["async", "platform-embassy"] }
twine-reactive = { path = "../twine-reactive" }
twine-view = { path = "../twine-view", features = ["async"] }
embassy-time = "0.5"
embassy-futures = "0.1"
defmt = { version = "1", optional = true }

[dev-dependencies]
twine-view = { path = "../twine-view", features = ["async", "std"] }
twine-engine = { path = "../twine-engine", features = ["std", "debug-checks", "color-rgb565"] }
twine-testing = { path = "../twine-testing" }
embassy-time = { version = "0.5", features = ["mock-driver", "generic-queue-8"] }
critical-section = { version = "1", features = ["std"] }
