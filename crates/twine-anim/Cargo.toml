[package]
name = "twine-anim"
description = "Animations, easing, timelines and timers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## The safety profile (`twine` feature `safety`, see `docs/safety/profile.md`): the
## safety lints of library code and the refusal of excluded features.
safety = ["twine-core/safety"]
## Partitioned runtimes (ADR-001): forwards to `twine-core/partitions` (each table notes its
## growth in its partition's seal domain, `Timers::set_partition`).
partitions = ["twine-core/partitions"]
## std-only conveniences.
std = ["twine-core/std"]
## Log through the `log` crate.
log = ["twine-core/log"]
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = ["dep:defmt", "twine-core/defmt"]

[dependencies]
twine-core = { path = "../twine-core" }
defmt = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
twine-testing = { path = "../twine-testing", default-features = false }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "timeline"
harness = false
