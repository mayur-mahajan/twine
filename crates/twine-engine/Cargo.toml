[package]
name = "twine-engine"
description = "Widget tree, events, input, scrolling, invalidation and refresh pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## The safety profile (`twine` feature `safety`, see `docs/safety/profile.md`): the
## safety lints of library code and the refusal of excluded features.
safety = [
    "twine-anim/safety",
    "twine-core/safety",
    "twine-hal/safety",
    "twine-image/safety",
    "twine-layout/safety",
    "twine-render/safety",
    "twine-style/safety",
    "twine-text/safety",
    "twine-vector?/safety",
    "display-integrity",
]
## Display-integrity mechanisms: frame observers, region re-render / read-back /
## checks, `ObjFlags::SAFETY_CRITICAL`, the validity marks and the fail-safe screen (`docs/safety/profile.md` § 11); implied by `safety`. Off: not linked.
display-integrity = ["twine-render/display-integrity", "twine-text/display-integrity"]
## Partitioned runtimes (ADR-001): `Engine::set_partition` names one of 4 partitions instead
## of 1 (the engine's growth is noted in that partition's seal domain). Not implied by `safety`.
partitions = ["twine-core/partitions", "twine-anim/partitions"]
## std-only conveniences.
std = [
    "twine-core/std",
    "twine-anim/std",
    "twine-render/std",
    "twine-text/std",
    "twine-image/std",
    "twine-style/std",
    "twine-layout/std",
    "twine-fs?/std",
    "twine-vector?/std",
]
## Log through the `log` crate.
log = [
    "twine-core/log",
    "twine-hal/log",
    "twine-anim/log",
    "twine-render/log",
    "twine-text/log",
    "twine-image/log",
    "twine-style/log",
    "twine-layout/log",
    "twine-fs?/log",
    "twine-vector?/log",
]
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = [
    "dep:defmt",
    "twine-core/defmt",
    "twine-hal/defmt",
    "twine-anim/defmt",
    "twine-render/defmt",
    "twine-text/defmt",
    "twine-image/defmt",
    "twine-style/defmt",
    "twine-layout/defmt",
    "twine-fs?/defmt",
    "twine-vector?/defmt",
]
## Expensive invariant checks (tree invariants after every mutation, style cache verification,
## invalidation log, render hook). Enabled in tests.
debug-checks = []
## On-screen performance overlay (`Engine::set_perf_overlay`).
perf-monitor = []
## Keep `test_id`s on nodes in release builds (always on with `debug_assertions`).
test-ids = []
## `Engine::set_vfs`: file images (`ImageSource::File`) read through `twine-fs`.
fs = ["dep:twine-fs"]
## `ImageSource::Svg`: SVG images parsed once (cached) and drawn through `twine-vector`.
svg = ["dep:twine-vector", "twine-vector/svg"]
## Pixel formats the renderer is compiled for (forwarded to `twine-render`).
color-rgb565 = ["twine-render/color-rgb565"]
color-rgb565-swapped = ["twine-render/color-rgb565-swapped"]
color-rgb888 = ["twine-render/color-rgb888"]
color-xrgb8888 = ["twine-render/color-xrgb8888"]
color-argb8888 = ["twine-render/color-argb8888"]
color-l8 = ["twine-render/color-l8"]
## `I1` (monochrome) displays: framebuffers are drawn in `I1`, partial and chunked displays in
## `L8` (converted per chunk), so both renderers are enabled.
color-i1 = ["twine-render/color-i1", "twine-render/color-l8"]

[dependencies]
twine-core = { path = "../twine-core" }
twine-hal = { path = "../twine-hal" }
twine-anim = { path = "../twine-anim" }
twine-render = { path = "../twine-render" }
twine-text = { path = "../twine-text" }
twine-image = { path = "../twine-image" }
twine-style = { path = "../twine-style" }
twine-layout = { path = "../twine-layout" }
twine-fs = { path = "../twine-fs", optional = true }
twine-vector = { path = "../twine-vector", optional = true }
bitflags = { version = "2", default-features = false }
heapless = { version = "0.8", default-features = false }
thiserror = { version = "2", default-features = false }
defmt = { version = "1", optional = true }

# No excluded part of the safety profile here (`perf-monitor`, `fs`, `twine-fs`): the suite also
# runs with `--features safety` (`cargo xtask ci` stage `test-features`), and the tests of those
# parts run with `--features perf-monitor,fs` (same stage; `twine-fs` is then the optional
# normal dependency).
[dev-dependencies]
twine-engine = { path = ".", features = [
    "std",
    "debug-checks",
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
] }
twine-testing = { path = "../twine-testing", default-features = false, features = ["engine", "debug-checks"] }
twine-assets = { path = "../twine-assets", features = ["montserrat-14"] }
proptest = "1"
log = "0.4"
