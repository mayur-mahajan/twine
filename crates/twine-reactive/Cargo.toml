[package]
name = "twine-reactive"
description = "Fine-grained reactive signals runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## The safety profile (`twine` feature `safety`, see `docs/safety/profile.md`): the
## safety lints of library code, the refusal of excluded features, `no-panic-runtime`, and no
## panicking context lookups (`Scope::expect_context`, `MissingContext::panic`).
safety = ["twine-core/safety", "no-panic-runtime"]
## Failed writes and creations, capacity exhaustion and memo cycles are skipped with a `warn!`
## and a fault instead of panicking (crate docs § Failures).
no-panic-runtime = []
## Partitioned runtimes (ADR-001): `Partition::COUNT` = 4 independent runtimes, taken with
## `Runtime::take_partition`; every handle carries its partition (one byte), `Channel` and
## `Latest` record their consuming partition. Not implied by `safety`. Without it the runtime
## compiles to one state and zero-sized partition ids.
partitions = ["twine-core/partitions"]
## Thread-local runtime (host, simulator, tests): one runtime per thread. Without it the
## runtime lives in a `static`, owned by the context that took its `Runtime` token.
std = ["twine-core/std"]
## Debug diagnostics: every runtime access asks the interrupt probe (`set_interrupt_probe`) and
## panics when the runtime is used from interrupt context; with `partitions` and `std` it also
## panics when a handle of one partition is used while another partition's flush, update or
## batch runs (ADR-001 § 5.4).
debug-checks = []
## `Outbox::recv`: await commands from the UI in any executor (a plain `Future`, no dependency).
async = []
## Log through `defmt`.
defmt = ["dep:defmt", "twine-core/defmt"]
## Log through the `log` crate.
log = ["twine-core/log"]

[dependencies]
twine-core = { path = "../twine-core" }
critical-section = "1"
portable-atomic = { version = "1", default-features = false }
heapless = { version = "0.8", default-features = false }
defmt = { version = "1", optional = true }

[dev-dependencies]
# Enables the thread-local runtime for every test, doc-test and bench of this crate.
twine-reactive = { path = ".", features = ["std", "async"] }
critical-section = { version = "1", features = ["std"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.16"

[[bench]]
name = "reactive"
harness = false

[[bench]]
name = "reactive_iai"
harness = false
