[package]
name = "twine-text"
description = "Fonts, text layout and text rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## std-only conveniences, including the font encoder helpers used by the font generator.
std = ["twine-core/std", "twine-render/std"]
## Log through the `log` crate.
log = ["twine-core/log", "twine-render/log"]
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = ["dep:defmt", "twine-core/defmt", "twine-render/defmt"]
## Runtime TrueType/OpenType fonts (`TtfFont`, rasterized with `fontdue`; uses `f32`).
ttf = ["dep:fontdue", "dep:ttf-parser", "dep:static_cell"]
## Bidirectional text: visual reordering of mixed LTR/RTL lines (`unicode-bidi`).
bidi = ["dep:unicode-bidi"]
## Arabic/Persian contextual shaping into presentation forms.
arabic-shaping = []

[dependencies]
twine-core = { path = "../twine-core" }
twine-render = { path = "../twine-render" }
bitflags = { version = "2", default-features = false }
defmt = { version = "1", optional = true }
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"], optional = true }
# `post` table underline metrics (fontdue's own parser dependency).
ttf-parser = { version = "0.25", default-features = false, optional = true }
static_cell = { version = "2", optional = true }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"], optional = true }

[dev-dependencies]
twine-text = { path = ".", features = ["std", "ttf", "bidi", "arabic-shaping", "log"] }
twine-fs = { path = "../twine-fs" }
static_cell = "2"
log = "0.4"
twine-render = { path = "../twine-render", features = [
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
] }
twine-assets = { path = "../twine-assets", features = ["all-fonts"] }
twine-testing = { path = "../twine-testing", default-features = false, features = ["render"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }


[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.16"

[[bench]]
name = "text"
harness = false

[[bench]]
name = "text_iai"
harness = false
