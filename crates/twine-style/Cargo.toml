[package]
name = "twine-style"
description = "Style properties, selectors and resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## The safety profile (`twine` feature `safety`, see `docs/safety/profile.md`): the
## safety lints of library code and the refusal of excluded features.
safety = [
    "twine-anim/safety",
    "twine-core/safety",
    "twine-image/safety",
    "twine-render/safety",
    "twine-text/safety",
]
## Display scale (hi-DPI desktops): resolution converts logical lengths (`Length::Px`, and
## `Dp` after the DPI) to device pixels with `StyleSource::scale`. Without it lengths resolve as
## at 1× and the resolver has no scale stage.
display-scale = []
## std-only conveniences.
std = ["twine-core/std", "twine-anim/std", "twine-render/std", "twine-text/std", "twine-image/std"]
## Log through the `log` crate.
log = ["twine-core/log", "twine-anim/log", "twine-render/log", "twine-text/log", "twine-image/log"]
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = [
    "dep:defmt",
    "twine-core/defmt",
    "twine-anim/defmt",
    "twine-render/defmt",
    "twine-text/defmt",
    "twine-image/defmt",
]

[dependencies]
twine-core = { path = "../twine-core" }
twine-anim = { path = "../twine-anim" }
twine-render = { path = "../twine-render" }
twine-text = { path = "../twine-text" }
twine-image = { path = "../twine-image" }
bitflags = { version = "2", default-features = false }
defmt = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
twine-assets = { path = "../twine-assets", features = ["montserrat-14", "montserrat-28"] }
trybuild = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.16"

[[bench]]
name = "style"
harness = false

[[bench]]
name = "style_iai"
harness = false
