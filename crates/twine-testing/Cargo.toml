[package]
name = "twine-testing"
description = "Test harnesses, snapshots and mocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["ui"]
## `RenderHarness` over `twine-render`.
render = ["dep:twine-render"]
## `EngineHarness` over a bare `Engine`.
# NOTE(P09.S05): adds the optional engine/theme/assets deps and `EngineHarness`.
engine = ["render"]
## `TestUi` over the declarative `Ui`.
# NOTE(P15.S06): adds the optional reactive/view/widgets deps and `TestUi`.
ui = ["engine"]

[dependencies]
twine-core = { path = "../twine-core", features = ["std", "log"] }
twine-hal = { path = "../twine-hal", features = ["log"] }
twine-render = { path = "../twine-render", optional = true, features = [
    "log",
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
] }
png = "0.17"
log = "0.4"
env_logger = "0.11"
