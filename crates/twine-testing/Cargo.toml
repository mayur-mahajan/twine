[package]
name = "twine-testing"
description = "Test harnesses, snapshots and mocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["ui"]
## `RenderHarness` over `twine-render`.
render = ["dep:twine-render"]
## `EngineHarness`, `MockDmaDisplay` and `MockFramebufferDisplay` over a bare `Engine`.
engine = ["render", "dep:twine-engine", "dep:twine-style", "dep:twine-theme", "dep:twine-assets"]
## The engine's expensive invariant checks (invalidation log, render hook for the DMA mock);
## for tests, never for benchmarks.
debug-checks = ["engine", "twine-engine/debug-checks"]
## `TestUi` over the declarative `Ui`.
ui = ["engine", "dep:twine-reactive", "dep:twine-view", "dep:twine-widgets", "dep:twine-text", "dep:critical-section"]

[dependencies]
twine-core = { path = "../twine-core", features = ["std", "log"] }
twine-hal = { path = "../twine-hal", features = ["log"] }
twine-render = { path = "../twine-render", optional = true, features = [
    "log",
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
] }
# `debug-checks` is opt-in (feature `debug-checks`): benchmarks built on the harness must
# measure the engine without it.
twine-engine = { path = "../twine-engine", optional = true, features = [
    "std",
    "log",
    "perf-monitor",
    # Queries by test id also in release test builds.
    "test-ids",
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
] }
twine-style = { path = "../twine-style", optional = true, features = ["std", "log"] }
twine-theme = { path = "../twine-theme", optional = true, features = ["std", "log"] }
twine-assets = { path = "../twine-assets", optional = true }
twine-reactive = { path = "../twine-reactive", optional = true, features = ["std", "log"] }
twine-view = { path = "../twine-view", optional = true, features = ["std", "log"] }
twine-widgets = { path = "../twine-widgets", optional = true, features = ["std", "log"] }
twine-text = { path = "../twine-text", optional = true, features = ["std", "log"] }
# Host implementation of `critical-section` (used by reactive channels) for test binaries.
critical-section = { version = "1", optional = true, features = ["std"] }
png = "0.17"
log = "0.4"
env_logger = "0.11"
