[package]
name = "twine-drivers"
description = "Display, touch and input drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["all", "async", "testkit", "fbdev", "evdev"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
## Every driver and interface (CI, documentation, host tests).
all = [
    "spi", "spi-dma", "i2c", "i80", "qspi", "mipi-dcs",
    "ili9341", "ili9342", "ili9488", "st7789", "st7735", "st7796", "gc9a01", "jd9853",
    "co5300", "sh8601", "rm67162", "ssd1306", "sh1106",
    "xpt2046", "ft6x36", "gt911", "cst816s", "stmpe811", "axs5106l",
    "encoder", "keypad",
]
## Async variants (`embedded-hal-async`): `AsyncDcsInterface`, `AsyncMipiDcs`, async OLED
## drivers and `AsyncInputWait` for IRQ-driven input drivers.
async = ["dep:embedded-hal-async", "twine-hal/async"]
## Recording mock buses (`testkit` module) for host-side tests of code built on these drivers.
testkit = []
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = ["dep:defmt", "twine-core/defmt", "twine-hal/defmt"]
## Log through the `log` crate.
log = ["twine-core/log", "twine-hal/log"]

#! ### Bus interfaces
## 4-wire SPI with a DC pin (`SpiInterface`).
spi = []
## 4-wire SPI whose pixel transfers run by DMA while the engine renders (`DmaSpiInterface` over
## a chip-specific `DmaSpiBus`), for the blocking runtime (`Ui`, `twine::run::blocking`).
spi-dma = []
## I2C with control bytes (`I2cInterface`, OLEDs).
i2c = []
## Intel 8080 parallel bus bit-banged on GPIOs (`I80Interface8`/`I80Interface16`).
i80 = []
## Quad SPI of AMOLED controllers (`QspiInterface`, `QspiBus`).
qspi = []
## The generic MIPI DCS panel driver (`mipi_dcs`), for panels described by your own `PanelSpec`.
mipi-dcs = []

#! ### Displays
#! Each panel draws in one pixel format, which the renderer must be compiled for (a `color-*`
#! feature of `twine`; without it `Engine::add_display` returns `EngineError::FormatDisabled`).
#! This crate depends only on `twine-hal`, so a feature here cannot enable it: enable the panel
#! through the `twine` facade instead (`twine/drivers-<panel>`, which enables both), or enable
#! the `color-*` feature listed in `[package.metadata.twine.panel-color]` below yourself.
## ILI9341 240 × 320 (SPI).
ili9341 = ["mipi-dcs", "spi"]
## ILI9342C 320 × 240 (SPI).
ili9342 = ["mipi-dcs", "spi"]
## ILI9488 320 × 480, RGB666 (SPI).
ili9488 = ["mipi-dcs", "spi"]
## ST7789 240 × 320 / 240 × 240 / 135 × 240 (SPI).
st7789 = ["mipi-dcs", "spi"]
## ST7735R/S 128 × 160, 80 × 160 (SPI).
st7735 = ["mipi-dcs", "spi"]
## ST7796S 320 × 480 (SPI).
st7796 = ["mipi-dcs", "spi"]
## GC9A01 240 × 240 round (SPI).
gc9a01 = ["mipi-dcs", "spi"]
## JD9853 172 × 320 IPS (SPI).
jd9853 = ["mipi-dcs", "spi"]
## CO5300 AMOLED (QSPI).
co5300 = ["mipi-dcs", "qspi"]
## SH8601 AMOLED (QSPI).
sh8601 = ["mipi-dcs", "qspi"]
## RM67162 AMOLED (QSPI).
rm67162 = ["mipi-dcs", "qspi"]
## SSD1306 monochrome OLED (pass an `I2cInterface` or `SpiInterface`).
ssd1306 = []
## SH1106 monochrome OLED (pass an `I2cInterface` or `SpiInterface`).
sh1106 = []

#! ### Touch and input
## XPT2046 / ADS7843 resistive touch (SPI).
xpt2046 = []
## Focaltech FT6x36, FT5x06 and FT3168 capacitive touch (I2C).
ft6x36 = []
## Goodix GT911 capacitive touch (I2C).
gt911 = []
## Hynitron CST816S capacitive touch (I2C).
cst816s = []
## AXS5106L capacitive touch (I2C).
axs5106l = []
## ST STMPE811 resistive touch controller (I2C).
stmpe811 = []
## Rotary encoder on GPIOs (quadrature decoder + button).
encoder = []
## Key matrix on GPIOs.
keypad = []

#! ### Hosted (Linux)
#! Not part of `all` (they need `std`). They use only portable Unix file I/O (no `ioctl`, no
#! `unsafe`), so they build on any Unix host; their devices are Linux's.
## Linux framebuffer display `FbDev` (`/dev/fbN`, geometry from sysfs).
fbdev = ["std"]
## Linux input events `Evdev` (`/dev/input/eventN`, read on a thread; touchscreens and mice).
evdev = ["std"]
## The standard library (enabled by the hosted drivers).
std = ["twine-core/std"]

# The `twine` renderer feature each display feature needs (its `info().format`). Every feature of
# the "Displays" group above has an entry; the `twine` facade's `drivers-<panel>` features enable
# the panel and this colour feature together. Checked against the drivers' formats by
# `tests/panel_formats.rs` and against the facade by `cargo xtask layers`.
[package.metadata.twine.panel-color]
ili9341 = "color-rgb565-swapped"
ili9342 = "color-rgb565-swapped"
ili9488 = "color-rgb888"
st7789 = "color-rgb565-swapped"
st7735 = "color-rgb565-swapped"
st7796 = "color-rgb565-swapped"
gc9a01 = "color-rgb565-swapped"
jd9853 = "color-rgb565-swapped"
co5300 = "color-rgb565-swapped"
sh8601 = "color-rgb565-swapped"
rm67162 = "color-rgb565-swapped"
ssd1306 = "color-i1"
sh1106 = "color-i1"

[dependencies]
twine-core = { path = "../twine-core" }
twine-hal = { path = "../twine-hal" }
embedded-hal = "1"
embedded-hal-async = { version = "1", optional = true }
heapless = { version = "0.8", default-features = false }
portable-atomic = { version = "1", default-features = false }
defmt = { version = "1", optional = true }

[dev-dependencies]
# Unit tests, doc-tests and integration tests always see the async code and the recorders.
twine-drivers = { path = ".", features = ["all", "async", "testkit", "fbdev", "evdev"] }
critical-section = { version = "1", features = ["std"] }
proptest = "1"
twine-render = { path = "../twine-render" }
twine-engine = { path = "../twine-engine", features = ["color-rgb565-swapped"] }
