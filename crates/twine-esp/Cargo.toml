[package]
name = "twine-esp"
description = "esp-hal adapters for Twine drivers (quad-SPI bus for AMOLED panels)"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/twine"

# Not a member of the library workspace: esp-hal only builds for Espressif targets with exactly
# one chip feature. The firmware examples (`firmware/esp32*`) build it in CI.
[workspace]

[features]
default = []
## ESP32 (Xtensa).
esp32 = ["esp-hal/esp32"]
## ESP32-S3 (Xtensa).
esp32s3 = ["esp-hal/esp32s3"]
## ESP32-C3 (RISC-V).
esp32c3 = ["esp-hal/esp32c3"]
## ESP32-C6 (RISC-V).
esp32c6 = ["esp-hal/esp32c6"]

[dependencies]
esp-hal = { version = "1.2", features = ["unstable"] }
twine-drivers = { path = "../twine-drivers", features = ["qspi", "async"] }

[package.metadata.docs.rs]
features = ["esp32s3"]
targets = ["xtensa-esp32s3-none-elf"]
