[package]
name = "twine-extra"
description = "Extras: QR code, barcode, file explorer, IME, monkey, snapshot, sysmon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## QR code encoder (`QrMatrix`) and drawing helpers.
qrcode = ["dep:qrcodegen-no-heap", "dep:twine-render", "dep:thiserror"]
## Code 128 barcode encoder (`Code128`) and drawing helpers.
barcode = ["dep:twine-render", "dep:thiserror"]
## Translations (`i18n::Translations`, `provide_i18n`, `tr!`, `translations!`).
i18n = ["dep:twine-view", "dep:twine-reactive", "dep:critical-section", "dep:heapless"]
## std-only conveniences.
std = ["twine-core/std", "twine-reactive?/std", "twine-render?/std", "twine-view?/std"]
## Log through the `log` crate.
log = ["twine-core/log", "twine-render?/log", "twine-view?/log", "twine-reactive?/log"]
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = ["dep:defmt", "twine-core/defmt", "twine-render?/defmt", "twine-view?/defmt", "twine-reactive?/defmt"]

[dependencies]
twine-core = { path = "../twine-core" }
twine-render = { path = "../twine-render", optional = true }
twine-view = { path = "../twine-view", optional = true }
twine-reactive = { path = "../twine-reactive", optional = true }
critical-section = { version = "1", optional = true }
heapless = { version = "0.8", default-features = false, optional = true }
# NOTE(P25.S01): twine-engine, twine-widgets and twine-fs are added back with the QR/barcode
# widgets and the file explorer; the encoders and drawing helpers need none of them.
qrcodegen-no-heap = { version = "1.8", default-features = false, optional = true }
thiserror = { version = "2", default-features = false, optional = true }
defmt = { version = "1", optional = true }

[dev-dependencies]
twine-extra = { path = ".", features = ["qrcode", "barcode", "i18n", "std", "log"] }
twine-view = { path = "../twine-view", features = ["std", "log"] }
twine-reactive = { path = "../twine-reactive", features = ["std"] }
twine-testing = { path = "../twine-testing", features = ["ui", "render"] }
critical-section = { version = "1", features = ["std"] }
log = "0.4"
twine-render = { path = "../twine-render", features = ["color-rgb565", "color-l8"] }
# Independent QR / Code 128 decoder (a ZXing port): proves the generated symbols scan.
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "oned", "encoding_rs", "encoders"] }
