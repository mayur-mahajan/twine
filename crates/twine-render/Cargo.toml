[package]
name = "twine-render"
description = "Integer software renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## The safety profile (`twine` feature `safety`, see `docs/safety/profile.md`): the
## safety lints of library code and the refusal of excluded features.
safety = ["twine-core/safety", "display-integrity"]
## Display-integrity mechanisms: cache-free "fresh" drawing and `Painter::in_layer` (`docs/safety/profile.md` § 11); implied by `safety`. Off: not linked.
display-integrity = []
## Draw buffers in RGB565 (little-endian).
color-rgb565 = []
## Draw buffers in RGB565 with swapped bytes (SPI panels).
color-rgb565-swapped = []
## Draw buffers in RGB888 (B, G, R).
color-rgb888 = []
## Draw buffers in XRGB8888.
color-xrgb8888 = []
## ARGB8888 draw buffers. Always compiled (layers need it); the feature only exists for symmetry.
color-argb8888 = []
## Draw buffers in 8-bit luminance.
color-l8 = []
## Draw buffers in 1-bit monochrome (MSB first, byte-aligned areas).
color-i1 = []
## std-only conveniences.
std = ["twine-core/std"]
## Log through the `log` crate.
log = ["twine-core/log"]
## Log through `defmt` and derive `defmt::Format` on public types.
defmt = ["dep:defmt", "twine-core/defmt"]

[dependencies]
twine-core = { path = "../twine-core" }
thiserror = { version = "2", default-features = false }
defmt = { version = "1", optional = true }

[dev-dependencies]
# Every color format for tests, doc-tests and benches.
twine-render = { path = ".", features = [
    "color-rgb565",
    "color-rgb565-swapped",
    "color-rgb888",
    "color-xrgb8888",
    "color-argb8888",
    "color-l8",
    "color-i1",
] }
twine-testing = { path = "../twine-testing", default-features = false, features = ["render"] }
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.16"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "formats"
harness = false

[[bench]]
name = "iai"
harness = false
