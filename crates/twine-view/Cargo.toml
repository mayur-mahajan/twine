[package]
name = "twine-view"
description = "Declarative view layer and Ui runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
## std-only conveniences (thread-local reactive runtime: no binding needed).
std = [
    "twine-core/std",
    "twine-reactive/std",
    "twine-anim/std",
    "twine-style/std",
    "twine-engine/std",
    "twine-theme/std",
    "twine-widgets/std",
    "twine-widgets-ext/std",
    "twine-text/std",
    "twine-image/std",
    "twine-render/std",
    "twine-vector?/std",
]
## The async runtime `AsyncUi` (`Ui::builder_async`) for `AsyncDisplayDriver`s: frames are
## rendered chunk by chunk while the previous chunk is transferred (DMA). Run it with
## `twine-embassy`. Also enables `Outbox::recv` (`twine-reactive/async`).
async = ["twine-hal/async", "twine-reactive/async"]
## `vector_canvas`: vector graphics redrawn from signals (`twine-vector`).
vector = ["dep:twine-vector", "twine-widgets-ext/vector"]
## SVG images (`image(ImageSource::Svg(..))`, `.svg_cache`).
svg = ["twine-widgets/svg"]
## Log through the `log` crate.
log = [
    "twine-core/log",
    "twine-hal/log",
    "twine-reactive/log",
    "twine-anim/log",
    "twine-style/log",
    "twine-engine/log",
    "twine-theme/log",
    "twine-widgets/log",
    "twine-widgets-ext/log",
    "twine-text/log",
    "twine-image/log",
    "twine-render/log",
    "twine-vector?/log",
]
## Log through `defmt`.
defmt = [
    "dep:defmt",
    "twine-core/defmt",
    "twine-hal/defmt",
    "twine-reactive/defmt",
    "twine-anim/defmt",
    "twine-style/defmt",
    "twine-engine/defmt",
    "twine-theme/defmt",
    "twine-widgets/defmt",
    "twine-widgets-ext/defmt",
    "twine-text/defmt",
    "twine-image/defmt",
    "twine-render/defmt",
    "twine-vector?/defmt",
]

[dependencies]
twine-vector = { path = "../twine-vector", optional = true }
twine-core = { path = "../twine-core" }
twine-hal = { path = "../twine-hal" }
twine-reactive = { path = "../twine-reactive" }
twine-anim = { path = "../twine-anim" }
twine-render = { path = "../twine-render" }
twine-text = { path = "../twine-text" }
twine-image = { path = "../twine-image" }
twine-style = { path = "../twine-style" }
twine-engine = { path = "../twine-engine" }
twine-theme = { path = "../twine-theme", default-features = false }
twine-widgets = { path = "../twine-widgets" }
twine-widgets-ext = { path = "../twine-widgets-ext" }
# Debug-build diagnostics only (`EngineAccess`'s "warned once per call site" table); the
# application already supplies the implementation for `twine-reactive`.
critical-section = "1"
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
defmt = { version = "1", optional = true }

[dev-dependencies]
twine-view = { path = ".", features = ["std", "log", "vector"] }
twine-engine = { path = "../twine-engine", features = ["std", "debug-checks", "color-rgb565"] }
twine-testing = { path = "../twine-testing", features = ["debug-checks"] }
twine-hal = { path = "../twine-hal", features = ["platform-std"] }
# `debug-checks`: the interrupt-context assertion of the runtime (tests/platform.rs).
twine-reactive = { path = "../twine-reactive", features = ["std", "debug-checks"] }
twine-theme = { path = "../twine-theme" }
twine-assets = { path = "../twine-assets", features = ["montserrat-14", "montserrat-20"] }
critical-section = { version = "1", features = ["std"] }
proptest = "1"
# A real touch driver on a recording bus: fitted to the display by the builder, its health
# reported through the `Ui` (tests/input_setup.rs).
twine-drivers = { path = "../twine-drivers", features = ["ft6x36", "xpt2046", "testkit"] }
trybuild = "1"
log = "0.4"
twine-vector = { path = "../twine-vector" }
