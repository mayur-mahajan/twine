[package]
name = "twine-example-esp32s3"
description = "Example firmware: Twine on an ESP32-S3 with an SPI or QSPI (AMOLED) display and a touch controller"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone firmware project (not a member of the library workspace).
[workspace]

# Feature sets `cargo xtask firmware` builds ("" = the defaults).
[package.metadata.twine]
feature-sets = [
    "",
    "panel-st7789,touch-ft6x36,demo-controls",
    "panel-co5300,touch-ft6x36",
    "panel-sh8601,touch-ft6x36",
    "panel-rm67162,touch-cst816s",
    "panel-ili9341,touch-xpt2046,demo-calibrate",
    "panel-ili9341,touch-xpt2046,demo-selection", "panel-ili9341,touch-xpt2046,demo-lottie",
    "panel-ili9341,touch-xpt2046,demo-multilang",
    "panel-ili9342,touch-gt911,demo-counter",
    "panel-st7796,touch-cst816s,demo-counter",
    "oled-ssd1306,demo-counter",
]

[features]
default = ["panel-ili9341", "touch-xpt2046", "demo-counter"]
## ILI9341 240 × 320 SPI panel (turned to 320 × 240).
panel-ili9341 = ["spi-panel", "twine-drivers/ili9341"]
## ILI9342C 320 × 240 SPI panel (landscape native).
panel-ili9342 = ["spi-panel", "twine-drivers/ili9342"]
## ST7789 240 × 320 SPI panel (turned to 320 × 240).
panel-st7789 = ["spi-panel", "twine-drivers/st7789"]
## ST7796S 320 × 480 SPI panel (turned to 480 × 320).
panel-st7796 = ["spi-panel", "twine-drivers/st7796"]
## CO5300 AMOLED on quad SPI (e.g. 410 × 502).
panel-co5300 = ["qspi-panel", "twine-drivers/co5300", "dep:twine-esp"]
## SH8601 AMOLED on quad SPI (e.g. 368 × 448).
panel-sh8601 = ["qspi-panel", "twine-drivers/sh8601", "dep:twine-esp"]
## RM67162 AMOLED on quad SPI (240 × 536).
panel-rm67162 = ["qspi-panel", "twine-drivers/rm67162", "dep:twine-esp"]
## SSD1306 128 × 64 mono OLED on the I2C pins of the capacitive touch (no touch; mono theme).
oled-ssd1306 = ["twine-drivers/ssd1306", "twine-drivers/i2c", "twine/color-i1"]
## XPT2046 resistive touch on its own SPI bus.
touch-xpt2046 = ["touch", "twine-drivers/xpt2046"]
## FT6x36 / FT3168 capacitive touch on I2C.
touch-ft6x36 = ["touch", "i2c-touch", "twine-drivers/ft6x36"]
## GT911 capacitive touch on I2C.
touch-gt911 = ["touch", "i2c-touch", "twine-drivers/gt911"]
## CST816S capacitive touch on I2C.
touch-cst816s = ["touch", "i2c-touch", "twine-drivers/cst816s"]
## The counter demo.
demo-counter = []
## The controls demo (sliders, switches, arcs, spinner).
demo-controls = []
## The selection demo (dropdown, roller, list, menu, tabview, tileview, window, message box).
demo-selection = []
## Touch calibration: logs a `Calibration { .. }` to paste into the wiring block.
demo-calibrate = []
## Three Lottie animations (100 × 100 each; three 40 KB frame buffers on the heap).
demo-lottie = ["twine-demos/lottie"]
## The multilang demo with every font (Chinese and Japanese included).
demo-multilang = ["twine-demos/multilang-cjk"]
# Internal: set by the features above (do not enable directly).
spi-panel = []
qspi-panel = []
touch = []
i2c-touch = []

[dependencies]
twine = { path = "../../crates/twine", default-features = false, features = ["log", "color-rgb565-swapped", "perf-monitor", "montserrat-20"] }
twine-drivers = { path = "../../crates/twine-drivers", features = ["async", "log"] }
twine-embassy = { path = "../../crates/twine-embassy" }
twine-demos = { path = "../../crates/twine-demos", features = ["async"] }
twine-esp = { path = "../../crates/twine-esp", features = ["esp32s3"], optional = true }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-embedded-hal = "0.6"
embassy-sync = "0.8"
embedded-hal = "1"
critical-section = "1.2.0"
static_cell = "2.1.1"
log = "0.4.27"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
