[package]
name = "twine-example-rp2040"
description = "Example firmware: Twine on an RP2040 (Raspberry Pi Pico), bare metal (`twine::run::blocking`), with a DMA-driven SPI display and a touch controller"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone firmware project (not a member of the library workspace).
[workspace]

# Feature sets `cargo xtask firmware` builds ("" = the defaults).
[package.metadata.twine]
feature-sets = ["", "panel-st7789,touch-ft6x36,demo-controls", "panel-ili9341,touch-xpt2046,demo-calibrate", "panel-ili9341,touch-xpt2046,demo-selection", "panel-ili9341,touch-xpt2046,demo-multilang", "panel-ili9342,touch-gt911,demo-counter", "panel-st7796,touch-cst816s,demo-counter", "oled-ssd1306,demo-counter"]

[features]
default = ["panel-ili9341", "touch-xpt2046", "demo-counter"]
## ILI9341 240 × 320 SPI panel (turned to 320 × 240).
panel-ili9341 = ["spi-panel", "twine/drivers-ili9341"]
## ILI9342C 320 × 240 SPI panel (landscape native).
panel-ili9342 = ["spi-panel", "twine/drivers-ili9342"]
## ST7789 240 × 320 SPI panel (turned to 320 × 240).
panel-st7789 = ["spi-panel", "twine/drivers-st7789"]
## ST7796S 320 × 480 SPI panel (turned to 480 × 320).
panel-st7796 = ["spi-panel", "twine/drivers-st7796"]
## SSD1306 128 × 64 mono OLED on the I2C pins of the capacitive touch (no touch; mono theme).
oled-ssd1306 = ["twine/drivers-ssd1306", "twine/drivers-i2c"]
## XPT2046 resistive touch on its own SPI bus.
touch-xpt2046 = ["touch", "twine/drivers-xpt2046"]
## FT6x36 capacitive touch on I2C.
touch-ft6x36 = ["touch", "i2c-touch", "twine/drivers-ft6x36"]
## GT911 capacitive touch on I2C.
touch-gt911 = ["touch", "i2c-touch", "twine/drivers-gt911"]
## CST816S capacitive touch on I2C.
touch-cst816s = ["touch", "i2c-touch", "twine/drivers-cst816s"]
## The counter demo.
demo-counter = []
## The controls demo (sliders, switches, arcs, spinner).
demo-controls = []
## The selection demo (dropdown, roller, list, menu, tabview, tileview, window, message box).
demo-selection = []
## Touch calibration: logs a `Calibration { .. }` to paste into the wiring block.
demo-calibrate = []
## The multilang demo without the 165 KB CJK font (the Chinese and Japanese cards say so):
## European languages, Hebrew, Arabic and Persian.
demo-multilang = ["twine-demos/multilang"]
# Internal: set by the features above (do not enable directly).
spi-panel = []
touch = []
i2c-touch = []

[dependencies]
twine = { path = "../../crates/twine", default-features = false, features = ["defmt", "perf-monitor", "montserrat-20", "drivers-spi-dma"] }
twine-demos = { path = "../../crates/twine-demos", features = ["defmt"] }

# `unstable-pac`: the SPI0/DMA registers for the display's DMA transfers (`PicoDmaSpi`).
embassy-rp = { version = "0.10", features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "unstable-pac"] }
# embassy-rp as a HAL only (no executor): `embassy-time` reads the clock and times init delays;
# its timer queue is the generic one (nothing schedules timers without an executor).
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "generic-queue-8"] }
embassy-embedded-hal = { version = "0.6", features = ["defmt"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-alloc = "0.7"
# The RP2040 has no atomic read-modify-write instructions: atomics go through critical sections.
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2.1"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
opt-level = "s"
lto = true
debug = 2
codegen-units = 1

[profile.dev]
opt-level = "s"
