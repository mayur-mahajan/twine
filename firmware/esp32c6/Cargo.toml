[package]
name = "twine-example-esp32c6"
description = "Example firmware: Twine on an ESP32-C6 with an SPI display and a touch controller"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone firmware project (not a member of the library workspace).
[workspace]

# Feature sets `cargo xtask firmware` builds ("" = the defaults).
[package.metadata.twine]
feature-sets = [
    "",
    "panel-jd9853,touch-axs5106l,demo-controls",
    "panel-st7789,touch-ft6x36,demo-controls",
    "panel-ili9341,touch-xpt2046,demo-calibrate",
    "panel-jd9853,touch-axs5106l,demo-selection",
    "panel-ili9342,touch-gt911,demo-counter",
    "panel-st7796,touch-cst816s,demo-counter",
    "oled-ssd1306,demo-counter",
]

[features]
default = ["panel-jd9853", "touch-axs5106l", "demo-counter"]
## JD9853 172 × 320 SPI panel (1.47" IPS, portrait).
panel-jd9853 = ["spi-panel", "twine/drivers-jd9853"]
## ILI9341 240 × 320 SPI panel (turned to 320 × 240).
panel-ili9341 = ["spi-panel", "twine/drivers-ili9341"]
## ILI9342C 320 × 240 SPI panel (landscape native).
panel-ili9342 = ["spi-panel", "twine/drivers-ili9342"]
## ST7789 240 × 320 SPI panel (turned to 320 × 240).
panel-st7789 = ["spi-panel", "twine/drivers-st7789"]
## ST7796S 320 × 480 SPI panel (turned to 480 × 320).
panel-st7796 = ["spi-panel", "twine/drivers-st7796"]
## SSD1306 128 × 64 mono OLED on the I2C pins of the capacitive touch (no touch; mono theme).
oled-ssd1306 = ["twine/drivers-ssd1306", "twine/drivers-i2c"]
## AXS5106L capacitive touch on I2C.
touch-axs5106l = ["touch", "i2c-touch", "twine/drivers-axs5106l"]
## XPT2046 resistive touch sharing the display's SPI bus (own chip select).
touch-xpt2046 = ["touch", "twine/drivers-xpt2046"]
## FT6x36 capacitive touch on I2C.
touch-ft6x36 = ["touch", "i2c-touch", "twine/drivers-ft6x36"]
## GT911 capacitive touch on I2C.
touch-gt911 = ["touch", "i2c-touch", "twine/drivers-gt911"]
## CST816S capacitive touch on I2C.
touch-cst816s = ["touch", "i2c-touch", "twine/drivers-cst816s"]
## The counter demo.
demo-counter = []
## The controls demo (sliders, switches, arcs, spinner).
demo-controls = []
## The selection demo (dropdown, roller, list, menu, tabview, tileview, window, message box).
demo-selection = []
## Touch calibration: logs a `Calibration { .. }` to paste into the wiring block.
demo-calibrate = []
# Internal: set by the features above (do not enable directly).
spi-panel = []
touch = []
i2c-touch = []

[dependencies]
twine = { path = "../../crates/twine", default-features = false, features = ["log", "perf-monitor", "montserrat-20", "embassy"] }
twine-demos = { path = "../../crates/twine-demos", features = ["async"] }

esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-embedded-hal = "0.6"
embassy-sync = "0.8"
embedded-hal = "1"
critical-section = "1.2.0"
static_cell = "2.1.1"
log = "0.4.27"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
